<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>logit · 팀 의사결정</title>
<style>
:root{--acc:#F2541B;--ink:#16181D;--sub:#6E727A;--line:#E3E4E7;--bg:#F6F6F7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.8px}.brand span{color:var(--acc)}
.prog{flex:1;height:6px;background:#E6E7EA;border-radius:3px;overflow:hidden;max-width:360px}.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.cnt{font-size:13px;color:var(--sub);white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.sec{font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:6px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.4px;line-height:1.35}
.en{color:var(--sub);font-size:13.5px}
.why{margin:12px 0 4px;padding:10px 12px;background:#F7F7F8;border-radius:10px;font-size:13.5px;color:#3C3F46}
.opts{display:grid;gap:8px;margin-top:16px}
.opts.vis{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}
.opt:hover{border-color:#C9CBD0}
.opt.on{border-color:var(--acc);background:#FFF6F2}
.mark{width:20px;height:20px;border-radius:50%;border:1.5px solid #BFC2C7;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.multi .mark{border-radius:5px}
.on .mark{background:var(--acc);border-color:var(--acc)}
.on .mark:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.multi .on .mark:after{border-radius:1px;width:9px;height:5px;background:none;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt b{display:block;font-weight:600}
.enl{display:block;font-size:13.5px;color:#4A4D55;font-weight:500;margin-top:1px}
.ens{color:#8A8D94!important;font-size:12px!important;margin-top:0!important}
.opt small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.opt.vcard{flex-direction:column;padding:10px}
.opt.vcard .pv{width:100%;height:300px;border-radius:8px;overflow:hidden;background:#EEE;display:flex;align-items:center;justify-content:center}
.opt.vcard .pv img{height:100%;width:auto;display:block}
.opt.vcard .lb{display:flex;gap:8px;align-items:flex-start;width:100%}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.free{margin-top:14px}
.free label{display:block;font-size:13px;font-weight:600;color:#3C3F46;margin-bottom:6px}
.free textarea,.free input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:0;resize:vertical}
.free textarea:focus,.free input:focus{border-color:var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;flex:1}
.btn.g{background:#ECEDF0}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:12.5px;color:var(--sub);margin-top:10px}
/* wireframes */
.wf{width:150px;height:290px;border:2px solid #2B2D33;border-radius:18px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:5px;font-size:9px;color:#555}
.wf .b{background:#E4E5E8;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.wf .m{background:#DCE8D8}.wf .o{background:#F7C9B5}.wf .t{height:16px;background:#2B2D33;color:#fff;border-radius:4px;display:flex;align-items:center;justify-content:space-around;font-size:8px}
.sum{display:grid;gap:10px;margin-top:14px}
.sum div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.sum b{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);margin:4px 6px 0 0;cursor:pointer;background:#fff}
.pill.on{border-color:var(--acc);background:#FFF6F2}
a{color:var(--acc)}
.done{text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<div class="wrap">
  <div class="top"><div class="brand">logit<span>.</span> <span style="color:#6E727A;font-size:14px;font-weight:600;letter-spacing:0">팀 의사결정 · Team decisions</span></div><div class="prog"><i id="pg"></i></div><div class="cnt" id="cnt"></div></div>

</div>

 {sec:"A. 기본 정체성 · Basics",id:"users",t:"주 사용자는 누구인가요? (여러 개 선택 가능)",en:"Who are the main users? (multiple)",type:"multi",

const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

 $("#prev").disabled=i===0;
 if(i>=Q.length)return renderSum();
 const q=Q[i],a=A[q.id]||{sel:[],free:""};
 $("#next").textContent=i===Q.length-1?"검토하기 · Review":"다음 · Next";
 $("#card").innerHTML=`<div class="sec">${q.sec}</div><h1>Q${i+1}. ${q.t}</h1><div class="en" style="font-size:16px;font-weight:600;color:#4A4D55">${q.en}</div>
 ${q.why?`<div class="why">${q.why}${WHY_EN[q.id]?`<div class="en" style="margin-top:4px">${WHY_EN[q.id]}</div>`:""}</div>`:""}

async function copy(){const t=text();try{await navigator.clipboard.writeText(t);toast("답변을 복사했어요")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("답변을 복사했어요")}}
function submit(){const t=text();copy();const who=(A.who&&(A.who.sel[0]||A.who.free))||"이름 없음";
 let body=t;let url=`https://github.com/keemlogan/logit/issues/new?title=${encodeURIComponent("[답변] "+who)}&labels=answer&body=`;
 if((url+encodeURIComponent(body)).length>7500)body="(답변이 길어 자동으로 복사되었습니다. 여기에 붙여넣기 해 주세요: Ctrl/⌘+V)";
 window.open(url+encodeURIComponent(body),"_blank")}
