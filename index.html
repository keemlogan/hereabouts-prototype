<!doctype html>
<html lang="en">
<head>

<title>Hereabouts</title>

<style>
:root{--acc:#F2541B;--ink:#16181D;--sub:#6E727A;--mute:#9A9EA5;--line:#E7E8EA;--bg:#F1F1F2;--eat:#E2581B;--do:#1D6FD1;--ok:#13804B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E4E5E8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"Pretendard",sans-serif;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.phone{position:relative;width:100%;height:100%;background:#fff;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:560px){body{display:flex;align-items:center;justify-content:center;gap:56px}
 .phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 11px #0E0F12,0 30px 70px rgba(0,0,0,.28)}
 .side{display:block!important}}
.side{display:none;width:240px;font-size:13px;color:#555;line-height:1.6}

.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:82px;background:rgba(255,255,255,.96);border-top:.5px solid #D9DADC;display:flex;padding-top:7px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E9198}
.tab svg.i{width:25px;height:25px;stroke-width:1.6}
.tab.on{color:var(--acc)}
.nav{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px;border-bottom:.5px solid transparent}

.sub{color:var(--sub);font-size:13px}

.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.av{border-radius:50%;object-fit:cover;flex:none;background:#ddd}

.mapchips{position:absolute;top:110px;left:0;right:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:2px 12px 6px}
.mapchips::-webkit-scrollbar{display:none}
.mc{flex:none;height:32px;padding:0 13px;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}

.mk{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;transition:opacity .2s}

.mk.out{opacity:.35}
.me{width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 7px rgba(26,115,232,.18),0 1px 3px rgba(0,0,0,.3)}
.num{width:22px;height:22px;border-radius:50%;background:var(--acc);border:2px solid #fff;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.num.s{background:#1E9E5A}.num.e{background:#16181D}
.dot{width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.bsheet{position:absolute;left:0;right:0;bottom:0;height:50%;z-index:6;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.14);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1)}

.handle{padding:8px 0 4px;display:flex;justify-content:center;cursor:pointer}

.bscroll{flex:1;overflow-y:auto}.bscroll::-webkit-scrollbar{display:none}
.rad{padding:2px 16px 10px}
.rad .v{font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p),#E2E3E6 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#E2E3E6}
input[type=range]::-moz-range-progress{height:4px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:-2px}
.sortbar{display:flex;gap:6px;padding:4px 16px 10px;border-bottom:.5px solid var(--line)}
.sortbar button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);font-size:13px;font-weight:500;color:#3A3D44}
.sortbar button.on{border-color:#2B2D33;background:#2B2D33;color:#fff}
.note{padding:10px 16px;font-size:13px;color:var(--sub);background:#F7F7F8;border-bottom:.5px solid var(--line)}
.pl{display:flex;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--line);cursor:pointer}
.pl h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.1px}
.pl .ph{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none}
.score{font-size:13px;color:#3A3D44;margin:3px 0 1px;display:flex;align-items:center;gap:6px}
.score b{color:var(--ok);font-weight:600}
.meter{display:inline-block;width:42px;height:4px;border-radius:2px;background:#E4E5E7;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.tip{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:13px;color:#3A3D44;line-height:1.35}
.tip img{margin-top:1px}
.tip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nextl{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12.5px;color:var(--sub)}
.nextl svg.i{width:14px;height:14px}
.gem{color:#7A3FC7;font-weight:600}
.secth{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0;padding:22px 16px 10px}
.secth small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px;letter-spacing:0}
.hero{position:relative;height:250px;background:#ddd}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.fbtn{position:absolute;top:52px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:3}
.ptitle{padding:14px 16px 0}
.ptitle h1{font-size:23px;margin:0;letter-spacing:-.4px}
.acts{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto}.acts::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1px solid #D7D9DD;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:#1D4FA8}
.pill.fill{background:#1D4FA8;border-color:#1D4FA8;color:#fff}
.pill svg.i{width:17px;height:17px}
.kv{display:flex;margin:14px 16px 0;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line)}
.kv div{flex:1;padding:11px 0;font-size:12px;color:var(--sub)}
.kv div+div{padding-left:14px;border-left:.5px solid var(--line)}
.kv b{display:block;font-size:17px;color:var(--ink);font-weight:600;margin-bottom:1px}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.li .th{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.pctbar{height:3px;border-radius:2px;background:#ECEDEF;margin-top:6px;overflow:hidden}.pctbar i{display:block;height:100%;background:var(--acc)}
.rv{padding:12px 16px;border-top:.5px solid var(--line)}
.rv p{margin:6px 0 4px;font-size:14.5px;line-height:1.45}
.okt{color:var(--ok);font-size:12.5px;font-weight:500}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px}.hs::-webkit-scrollbar{display:none}
.cover{flex:none;width:210px;height:140px;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#ccc}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .cap{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.cover .cap b{display:block;font-size:14.5px;line-height:1.25}
.cover .cap span{font-size:12px;opacity:.85}
.feedbg{background:var(--bg);min-height:100%}
.act{background:#fff;margin-bottom:8px;padding-top:14px}
.act .hd{display:flex;gap:10px;padding:0 16px;align-items:center}
.act .nm{font-weight:600;font-size:15px}
.act h2{font-size:19px;margin:10px 16px 4px;letter-spacing:-.3px;line-height:1.25;cursor:pointer}
.act .cap{margin:0 16px;font-size:14.5px;line-height:1.45;color:#2A2D33}
.stats{display:flex;padding:12px 16px 12px}
.stats div{padding-right:16px;margin-right:16px;border-right:.5px solid var(--line);font-size:12px;color:var(--sub)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-top:1px;letter-spacing:-.2px}
.media{display:flex;gap:2px;overflow-x:auto;height:220px}.media::-webkit-scrollbar{display:none}
.media .m{flex:none;width:100%;height:100%;cursor:pointer}
.media img{flex:none;width:200px;height:100%;object-fit:cover}
.stops{padding:10px 16px 0;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.stops svg.i{width:14px;height:14px}
.stops b{color:#2A2D33;font-weight:500}
.kudo{display:flex;align-items:center;gap:8px;padding:12px 16px 2px;font-size:13px;color:var(--sub)}
.stack{display:flex}.stack img{margin-left:-6px;border:2px solid #fff}.stack img:first-child{margin-left:0}
.bar3{display:flex;border-top:.5px solid var(--line);margin-top:10px}
.bar3 button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;color:#4A4D55;font-size:13px}
.bar3 button.on{color:var(--acc)}
.bar3 button.on svg.i{fill:var(--acc)}
.sugg{background:#fff;margin-bottom:8px;padding-bottom:16px}
.sc{flex:none;width:156px;border:.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.sc img{width:100%;height:96px;object-fit:cover;display:block}
.sc div{padding:8px 10px;font-size:12.5px;color:var(--sub);line-height:1.35}
.sc b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof{display:flex;align-items:center;gap:14px;padding:4px 16px 14px}
.prof h2{margin:0;font-size:19px}
.tstats{display:flex;padding:0 16px 14px;gap:28px}
.tstats div{font-size:12px;color:var(--sub)}.tstats b{display:block;font-size:20px;color:var(--ink);font-weight:600}
.tcard{margin:14px 16px 0;border-radius:14px;overflow:hidden;position:relative;height:200px;cursor:pointer;background:#ccc}
.tcard img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .cap{position:absolute;inset:auto 0 0 0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.tcard .cap b{font-size:19px;display:block;letter-spacing:-.3px}
.tcard .cap span{font-size:12.5px;opacity:.9}
.tcard .vis{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:12px;padding:3px 8px;font-size:11.5px;display:flex;gap:4px;align-items:center}
.tcard .vis svg.i{width:12px;height:12px}
.tmap{height:300px;position:relative}
.tl{padding:6px 16px 0 16px}
.step{display:flex;gap:14px}
.rail{width:22px;display:flex;flex-direction:column;align-items:center;flex:none}
.rail .n{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rail .ln{flex:1;width:2px;background:#E2E3E6;margin:4px 0}
.step .body{flex:1;padding-bottom:18px;min-width:0}
.step .body img.p{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-top:8px;display:block}
.leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.leg svg.i{width:15px;height:15px}
.form{padding:0 16px}
.fld{border-bottom:.5px solid var(--line);padding:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:0;outline:0;font-size:16px;padding:0;resize:none;background:none}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.lrow .grow b{font-weight:500;font-size:15.5px;display:block}
.sw{width:51px;height:31px;border-radius:16px;background:#E3E4E6;position:relative;flex:none;transition:.2s;cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:#34C759}.sw.on:after{left:22px}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C7C9CD;flex:none;display:flex;align-items:center;justify-content:center}
.on>.radio{border-color:var(--acc);background:var(--acc)}
.on>.radio:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.tchips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;border-bottom:.5px solid var(--line)}
.tchips button{height:32px;padding:0 13px;border-radius:16px;border:1px solid #D7D9DD;font-size:13.5px}
.tchips button.on{background:#2B2D33;border-color:#2B2D33;color:#fff}
.segs{display:inline-flex;background:#EEEFF1;border-radius:8px;padding:2px}
.segs button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:#555}
.segs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cta{display:flex;align-items:center;justify-content:center;height:50px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16.5px;width:100%}
.cta.ghost{background:none;color:#D93025;font-weight:500}
.recpanel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.12);padding:16px 16px 18px}
.metrics{display:flex;text-align:center}
.metrics div{flex:1;font-size:12px;color:var(--sub)}
.metrics b{display:block;font-size:30px;font-weight:600;color:var(--ink);letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:2px}
.metrics div+div{border-left:.5px solid var(--line)}
.recbtns{display:flex;align-items:center;justify-content:center;gap:40px;margin-top:18px}
.rb{width:76px;height:76px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;box-shadow:0 3px 10px rgba(242,84,27,.35)}
.rb.k{background:#16181D;box-shadow:none}
.rb.sm{width:56px;height:56px;background:#F1F2F4;color:var(--ink);box-shadow:none}
.mode{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:#F1F2F4;font-size:13px;font-weight:500}
.mode svg.i{width:16px;height:16px}
.gps{position:absolute;top:52px;left:12px;z-index:5;background:#fff;border-radius:15px;height:30px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gps i{width:8px;height:8px;border-radius:50%;background:#34C759}
.live i{background:#F2541B;animation:bl 1.1s infinite}@keyframes bl{50%{opacity:.25}}
.edit{border-bottom:.5px solid var(--line);padding:14px 0;display:flex;gap:12px}
.edit img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.edit input{width:100%;border:0;border-bottom:.5px solid var(--line);outline:0;padding:8px 0 6px;font-size:14px;background:none}
.banner{position:absolute;top:48px;left:8px;right:8px;z-index:60;background:rgba(250,250,250,.97);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:11px 14px;display:flex;gap:10px;align-items:center;transform:translateY(-220px);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.banner.show{transform:none}
.banner .ic{width:34px;height:34px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.banner b{font-size:14px;display:block}.banner span{font-size:13.5px;color:#3A3D44}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:14px}
</style>
</head>

  Clickable UI prototype for our Mobile Programming team project. Data is mocked; café and restaurant names are made up.<br><br>
  Try: drag the radius on Nearby, open a place, write a post from Home, and record a walk.<br><br>

const RP=[[0,0],[100,85],[320,210],[640,-1310]],RSTOP=["oven","plat","rail"];
const SEG=[[0,4,0,1,"walk"],[18,22,1,2,"walk"],[38,48,2,3,"bus"]],EV={14:0,34:1,62:2};
const R={on:false,t:0,timer:null,stops:[]};
function rpos(t){let p=RP[0],md=null;for(const [a,b,i,j,m] of SEG){if(t<a)break;const f=Math.min(1,(t-a)/(b-a));p=[RP[i][0]+(RP[j][0]-RP[i][0])*f,RP[i][1]+(RP[j][1]-RP[i][1])*f];if(t<=b)md=m}return {p,md}}
function rpath(t){const o=[RP[0]];for(const [a,b,i,j] of SEG){if(t<a)break;const f=Math.min(1,(t-a)/(b-a));o.push([RP[i][0]+(RP[j][0]-RP[i][0])*f,RP[i][1]+(RP[j][1]-RP[i][1])*f])}return o}
const toLL=p=>ll({dx:p[0],dy:p[1]});

function initRecord(){const m=mk("rmap",true);RM.m=m;m.setView(ME,16);
 RM.line=L.polyline([ME],{color:"#F2541B",weight:5,lineCap:"round"}).addTo(m);
 RM.me=L.marker(ME,{icon:div('<div class="me"></div>',18),interactive:false,zIndexOffset:1000}).addTo(m);RM.stops=L.layerGroup().addTo(m);updRecord()}
function updRecord(){if(!RM.m)return;const P=rpath(R.t).map(toLL);RM.line.setLatLngs(P);RM.me.setLatLng(toLL(rpos(R.t).p));
 RM.stops.clearLayers();R.stops.forEach((s,i)=>L.marker(ll(PL[s]),{icon:div(`<div class="num">${i+1}</div>`,22),interactive:false}).addTo(RM.stops));
 if(R.t>0)RM.m.fitBounds(L.latLngBounds(P.concat([ME])),{paddingTopLeft:[40,100],paddingBottomRight:[40,300],maxZoom:16,animate:false});recPanel()}

function go(t,id){S.stack.push({t,id});render();$("#screen").scrollTop=0}

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;
 switch(a){
  case "tab":S.tab=v;S.stack=[];render();$("#screen").scrollTop=0;break;
  case "chip":S.chip=S.chip===v?null:v;document.querySelectorAll(".mc").forEach(c=>c.classList.toggle("on",c.dataset.v===S.chip));updNearby(true);break;

  case "place":go("place",id);break;
  case "trip":go("trip",id);break;
  case "back":S.stack.pop();render();break;
  case "save":S.saved.has(id)?S.saved.delete(id):S.saved.add(id);keep();banner(S.saved.has(id)?"Saved":"Removed from saved",PL[id].name,"save");break;
  case "like":S.liked.has(id)?S.liked.delete(id):S.liked.add(id);keep();break;
  case "feedtab":S.feed=v;render();break;
  case "tv":S.tv=v;render();break;
  case "banner":banner(el.dataset.t,el.dataset.s,el.dataset.i);break;
  case "compose":S.pick=id||MY[0].id;S.ctags=new Set(["Food"]);go("compose");break;
  case "pick":S.pick=id;keep();break;
  case "ctag":S.ctags.has(v)?S.ctags.delete(v):S.ctags.add(v);el.classList.toggle("on");break;
  case "sw":el.classList.toggle("on");break;
  case "seg":[...el.parentNode.children].forEach(c=>c.classList.toggle("on",c===el));break;
  case "post":{const t=MY.find(x=>x.id===S.pick)||MY[0];const cap=$("#cap").value.trim();const title=$("#ptitle").value.trim()||t.title;
   FEED.unshift({...t,id:"p"+Date.now(),title,when:"Just now",cap,likes:0,by:null,cm:0});t.pub=true;
   S.stack=[];S.tab="feed";S.feed="following";render();$("#screen").scrollTop=0;banner("Posted","Your stops now show up in Nearby for others");break}
  case "recstart":R.on=true;R.t=0;R.stops=[];clearInterval(R.timer);R.timer=setInterval(tick,450);render();break;
  case "recff":for(let k=0;k<10;k++)tick();break;

  case "resume":S.stack=[];R.on=true;clearInterval(R.timer);R.timer=setInterval(tick,450);render();break;
  case "recdiscard":R.t=0;R.stops=[];S.stack=[];render();break;
  case "recsave":{if(R.stops.length)MY.unshift({id:"m"+Date.now(),u:"you",when:"Today",title:"Afternoon around campus",stops:[...R.stops],legs:[["walk",5],["bus",11]].slice(0,R.stops.length-1),km:+kmOf(R.t).toFixed(1),time:`${Math.floor(R.t/60)}h ${R.t%60}m`,pub:false,cover:PL[R.stops[0]].img});
   R.t=0;R.stops=[];S.stack=[];S.tab="trips";S.tv="trips";render();banner("Trip saved","Share it from the trip page");break}
 }});
render();
</script>
